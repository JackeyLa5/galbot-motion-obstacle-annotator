[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "galbot-motion-obstacle-annotator"
version = "0.1.0"
description = "PySide6 and PyVista tool for annotating Galbot Motion obstacles in point clouds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiajunjie", email = "jiajunjie@galbot.com" },
]
dependencies = [
  "numpy>=1.24",
  "PySide6>=6.6,<6.10",
  "pyvista>=0.46",
  "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
galbot-motion-obstacle-annotator = "galbot_motion_obstacle_annotator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galbot_motion_obstacle_annotator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["galbot_one_golf_description"]
