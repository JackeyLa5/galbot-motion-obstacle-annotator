[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "galbot-motion-obstacle-annotator"
version = "0.1.0"
description = "PySide6 and PyVista tool for annotating Galbot Motion obstacles in point clouds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiajunjie", email = "jiajunjie@galbot.com" },
]
dependencies = [
  "numpy>=1.24",
  "PySide6>=6.6,<6.10",
  "pyvista>=0.46",
  "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
pyroki = [
  "pyroki @ git+https://github.com/chungmin99/pyroki.git",
]

[project.scripts]
galbot-motion-obstacle-annotator = "galbot_motion_obstacle_annotator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galbot_motion_obstacle_annotator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["galbot_one_golf_description"]

[tool.ruff.lint.per-file-ignores]
# These catch arbitrary failures from an external SDK/JAX call and turn them
# into a PlanResult/CLI error message, or do best-effort cleanup after a
# planning failure — narrowing the exception type would mean guessing at
# what a library we don't control can raise.
"scripts/delete_obstacle.py" = ["BLE001"]
"scripts/query_obstacles.py" = ["BLE001"]
"src/galbot_motion_obstacle_annotator/planning/galbot_motion.py" = ["BLE001", "S110"]
# These isinstance checks validate untrusted external input (parsed JSON,
# caller-supplied `options` values), not an internal type contract, so they
# intentionally raise ValueError; tests/test_exporters.py already pins that.
"src/galbot_motion_obstacle_annotator/importers.py" = ["TRY004"]
"src/galbot_motion_obstacle_annotator/exporters.py" = ["TRY004"]
"src/galbot_motion_obstacle_annotator/planning/pyroki.py" = ["BLE001", "TRY004"]
